# Validate bonsai-mcp knowledge and generated architecture snapshots.
name: Validate MCP knowledge

on:
  push:
    paths:
      - "packages/bonsai-mcp/**"
      - "main.py"
      - "src/**"
      - "tests/preview-suite/**"
      - ".env.example"
  pull_request:
    paths:
      - "packages/bonsai-mcp/**"
      - "main.py"
      - "src/**"
      - "tests/preview-suite/**"
      - ".env.example"

jobs:
  validate-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MCP package dependencies
        run: npm ci
        working-directory: packages/bonsai-mcp

      - name: Validate knowledge + architecture freshness
        run: npm run validate -- --check-generated
        working-directory: packages/bonsai-mcp
        env:
          CI: true

      - name: Build MCP server
        run: npm run build
        working-directory: packages/bonsai-mcp
